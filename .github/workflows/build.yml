name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'
      - run: unzip -q yosun-android.zip
      - run: gradle assembleDebug --no-daemon
        working-directory: yosun-android
      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: yosun-android/app/build/outputs/apk/debug/*.apk
